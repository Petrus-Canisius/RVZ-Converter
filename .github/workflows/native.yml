name: Native build and UI smoke
on: [push, pull_request, workflow_dispatch]
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, rid: win-x64, architecture: X64 }
          - { runner: windows-11-arm, rid: win-arm64, architecture: Arm64 }
          - { runner: ubuntu-24.04, rid: linux-x64, architecture: X64 }
          - { runner: ubuntu-24.04-arm, rid: linux-arm64, architecture: Arm64 }
          - { runner: macos-15-intel, rid: osx-x64, architecture: X64 }
          - { runner: macos-15, rid: osx-arm64, architecture: Arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - name: Configure native Windows C++ tools
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.rid == 'win-arm64' && 'amd64_arm64' || 'x64' }}
      - name: Check native architecture
        shell: pwsh
        run: |
          if ([Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString() -ne '${{ matrix.architecture }}') { throw 'Native architecture mismatch; emulation is not a native test.' }
      - name: Install Linux display dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libx11-6 libice6 libsm6 libfontconfig1 ninja-build cmake pkg-config libudev-dev libncurses-dev zlib1g-dev libssl-dev gawk
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install ninja pkg-config gawk
      - name: Build and regression tests
        shell: pwsh
        run: |
          ./eng/build.ps1
          ./eng/test.ps1
      - name: Native UI smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pwsh -File eng/test.ps1 -Visual
      - name: Native UI smoke (Windows/macOS)
        if: runner.os != 'Linux'
        shell: pwsh
        run: ./eng/test.ps1 -Visual
      - name: Restore native engine build
        id: engine-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            artifacts/engines/${{ matrix.rid }}
            artifacts/sources/EngineSources-${{ matrix.rid }}.tar.gz
          key: engines-v1-${{ matrix.rid }}-${{ hashFiles('eng/engines.lock.json', 'eng/build-engines.ps1', 'eng/build-wit*', 'eng/inspect-*', 'eng/patches/*') }}
      - name: Build native conversion engines
        if: steps.engine-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./eng/build-engines.ps1 -RuntimeIdentifier '${{ matrix.rid }}'
      - name: Save verified native engines
        if: steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            artifacts/engines/${{ matrix.rid }}
            artifacts/sources/EngineSources-${{ matrix.rid }}.tar.gz
          key: ${{ steps.engine-cache.outputs.cache-primary-key }}
      - name: Publish application archive
        shell: pwsh
        run: ./eng/publish.ps1 -RuntimeIdentifier '${{ matrix.rid }}' -SkipChecks
      - name: Extracted package integration (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pwsh -File eng/test-package.ps1 -RuntimeIdentifier '${{ matrix.rid }}'
      - name: Extracted package integration (Windows/macOS)
        if: runner.os != 'Linux'
        shell: pwsh
        run: ./eng/test-package.ps1 -RuntimeIdentifier '${{ matrix.rid }}'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}-unsigned
          path: |
            artifacts/packages/*
            artifacts/sources/EngineSources-*.tar.gz
            artifacts/engines/*/*dependencies.txt
            artifacts/package-check-*/engine-integration.txt
            artifacts/package-check-*/native UI/*
            artifacts/visual-avalonia/*
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}-failure
          path: |
            artifacts/package-check-*/engine-integration.txt
            artifacts/engine-build/**/CMakeFiles/CMakeConfigureLog.yaml
